spring:
  application:
    name: fastproject
  datasource:
    url: jdbc:postgresql://localhost:5432/url_shortener
    username: dev_user
    password: dev_password
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379